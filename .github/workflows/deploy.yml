name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The site lives in frontend/; the repo root holds the workspace scaffolding.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # `cache: npm` looks for a lockfile at the repo root, which no longer
          # exists — point it at the real one or the cache step fails outright.
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      # `working-directory` does not apply to action steps, only to `run`, so
      # this path stays relative to the repo root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
